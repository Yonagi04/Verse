# 内容须与阿里云已审核模板同步；签名统一由 SmsDevAdapter 拼接。
templates:
  "10001":
    content: "您正在重置密码，验证码是${code}，5分钟内有效，请勿泄露或转发给其他人，以免造成账户或资金损失。"
  "10002":
    content: "您正在注销账号，验证码是${code}，5分钟内有效，请勿泄露或转发给其他人，以免造成账户或资金损失。"
  "10003":
    content: "${tenantName} 成本限额告警：${serviceName} 触发 ${period} 成本限额阈值，当前周期内的可用额度为 ${remainingYuan}。"
  "10004":
    content: "${tenantName} 成本限额告警：${serviceName} 在 ${period} 的调用成本已达限额，模型已停用。如需继续使用请调整限额"
  "10005":
    content: "${tenantName} 租户成本限额告警：已触发 ${period} 成本限额阈值，当前周期内的可用额度为 ${remainingYuan}。"
  "10006":
    content: "${tenantName} 租户成本限额告警：${period} 的调用成本已达限额，租户下所有新的模型调用已被限制。如需继续使用请调整限额或等待相关周期重置"
  "10007":
    content: "个人${period}费用预警：北京时间${start}至${end}（结束不含），所有租户的已知预估费用已达${amount}元，达到预警金额${threshold}元。仅用于提醒，不限制调用，具体用量详情可在个人中心查看。"
