spring:
  profiles:
    group:
      dev: messaging-dev
      test: messaging-dev
      prod: messaging-prod
  application:
    name: Verse
  servlet:
    multipart:
      # 音频转写允许 25 MiB；租户图片仍由业务层执行 5 MiB 上限。
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/verse?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: select 1
      connection-timeout: 20000
      idle-timeout: 30000
      # 登录审计/计数/通知改为异步消费者落库，消费者线程也占用连接，故上调最大连接数
      maximum-pool-size: 10
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
  port: 8080

verse:
  query-cache:
    # 缓存键前缀统一定义于 RedisKeyConstant，不配置额外命名空间。
    wait-millis: 3000
    max-concurrency: 8
    negative-seconds: 600
    large-value-bytes: 1048576
    fence-retry-delay-millis: 5000
    fence-retry-batch: 32
    fence-pending-limit: 512
    fence-cleanup-batches: 5
  external-auth:
    enabled: ${VERSE_EXTERNAL_AUTH_ENABLED:false}
    frontend-origin: ${VERSE_FRONTEND_ORIGIN:http://localhost:3000}
    connect-timeout: ${VERSE_EXTERNAL_AUTH_CONNECT_TIMEOUT:5s}
    read-timeout: ${VERSE_EXTERNAL_AUTH_READ_TIMEOUT:15s}
    proxy-url: ${VERSE_EXTERNAL_AUTH_PROXY_URL:}
    auth-ttl: 10m
    action-ttl: 5m
    recent-auth-ttl: 5m
    starts-per-minute: 10
    password-attempts: 5
    providers:
      google:
        enabled: ${VERSE_GOOGLE_ENABLED:false}
        client-id: ${VERSE_GOOGLE_CLIENT_ID:}
        client-secret: ${VERSE_GOOGLE_CLIENT_SECRET:}
      github:
        enabled: ${VERSE_GITHUB_ENABLED:false}
        client-id: ${VERSE_GITHUB_CLIENT_ID:}
        client-secret: ${VERSE_GITHUB_CLIENT_SECRET:}
      gitlab:
        enabled: ${VERSE_GITLAB_ENABLED:false}
        client-id: ${VERSE_GITLAB_CLIENT_ID:}
        client-secret: ${VERSE_GITLAB_CLIENT_SECRET:}
      feishu:
        enabled: ${VERSE_FEISHU_ENABLED:false}
        client-id: ${VERSE_FEISHU_APP_ID:}
        client-secret: ${VERSE_FEISHU_APP_SECRET:}
  frontend-baseurl: http://localhost:3000
  llm:
    costing:
      # 用量计费总开关；关闭后不再投递用量事件。
      enabled: true
    usage-outbox:
      # 关闭时停止新增与 Relay；已有 Outbox 与事实记录均保留。
      enabled: true
      batch-size: 100
      relay-delay-ms: 1000
      claim-lease-ms: 30000
      max-attempts: 8
      initial-backoff-ms: 1000
      max-backoff-ms: 300000
      retention-days: 30
      cleanup-delay-ms: 3600000
    usage-reporting:
      enabled: true
      refresh-delay-ms: 300000
      refresh-lookback-hours: 2
      compensation-days: 7
      compensation-cron: "0 20 1 * * ?"
      max-range-days: 366
      raw-export-max-range-days: 31
      export-max-rows: 100000
      export-batch-size: 1000
      export-max-concurrency: 2
    upstream:
      connect-timeout: 5000
      read-timeout: 120000
      # 同模型安全重试次数（不含首次调用）；结果未知时不会重试。
      max-retries: 1
      # 网关单次等待上游的上限（毫秒）；取消 Future 不保证上游执行已结束。
      time-limit-ms: 120000
      # 每个实例的同步执行上限；不排队，超时后未退出的任务继续占用容量。
      max-concurrency: 32
      # 关闭时先停止接收，再有界等待，随后请求中断剩余任务。
      shutdown-grace-ms: 5000
      # 流式 chunk 间空闲超时（毫秒），区别于 time-limit-ms 的单次等待上限。
      stream-idle-timeout-ms: 120000
    media:
      # 请求与响应上限均在调用上游前后强制执行。
      max-upload-bytes: 26214400
      max-output-bytes: 26214400
      max-image-json-bytes: 8388608
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-open-ms: 30000
    rate-limit:
      # 全局默认值（预留：本阶段限流阈值取自 t_tenant/t_api_key/t_llm_service 字段，NULL=不限，此处默认值暂未接入）
      default-tenant-rpm: 600
      default-tenant-tpm: 60000
      default-apikey-rpm: 60
      default-apikey-tpm: 6000
      default-model-rpm: 60
      default-model-tpm: 6000
    audit:
      # 审计概略截断长度（字符），超出部分追加 "..."，仅用于列表展示，详情回源 S3 取全量
      preview-length: 20
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
      expiration: 86400000
    encryption:
      # AES 密钥，这里是开发环境的示例，实际使用中请更换为安全的随机密钥
      aes-key: ${AES_KEY:8EbY4aJDfFyuf2Vg1on5tQQvZZst+uy0p3evu04CvJc=}
      hash-pepper: ${HASH_PEPPER:kCtFFuFhJn+V8SGqCiXlJg==}
    # JWT 认证白名单（不走 JWT 鉴权，如 LLM 调用接口使用 API Key 独立认证）
    ignore-paths: /api/v1/user/hasUsername,/api/v1/users/register,/api/v1/users/login,/api/v1/users/password/**,/api/v1/tenants/invites/**/info,/api/v1/openai/**,/api/v1/rerank,/ws/**
  tenant:
    max-invite-code-per-day: 10
    max-notification-send-per-day: 5
    # 路径中存在 tenantId 时强制与 JWT 当前租户一致；紧急回滚时可临时关闭。
    context-isolation-enabled: true
  async:
    # 每类副作用可独立降级为同步执行（不走 MQ，直接调用 handler），用于 MQ 故障时的回滚开关
    login-log:
      sync-fallback: false
    counter:
      sync-fallback: false
    domain-outbox:
      # 仅暂停 Relay；业务事务仍持续暂存可靠事件。
      relay-enabled: true
      batch-size: 100
      relay-delay-ms: 1000
      claim-lease-ms: 30000
      max-attempts: 8
      initial-backoff-ms: 1000
      max-backoff-ms: 300000
      reconciliation-threshold-ms: 300000
      reconciled-retention-days: 30
      maintenance-delay-ms: 60000
      details-max-bytes: 8192
  geoip:
    db-path: classpath:geoip/GeoLite2-City.mmdb
    enabled: true
  s3:
    endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:verse}
    base-url: ${S3_BASE_URL:https://s3.amazonaws.com}

rocketmq:
  name-server: ${MQ_NAME_SRV:127.0.0.1:9876}
  producer:
    group: verse-event-producer
    topic: verse-event
    send-message-timeout: 3000
    retry-times-when-send-failed: 1
    retry-times-when-send-async-failed: 1
  consumer:
    group: verse-event-consumer
    # 消费失败重试超过阈值后自动进入死信队列 %DLQ%verse-event-consumer；
    # 生产环境需监控死信数量与消费积压（consumer lag）
