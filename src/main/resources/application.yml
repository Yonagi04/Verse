spring:
  application:
    name: Verse
  datasource:
    username: root
    password: 20040401
    url: jdbc:mysql://127.0.0.1:3306/verse?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: select 1
      connection-timeout: 20000
      idle-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
  port: 8080

verse:
  frontend-baseurl: http://localhost:3000
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
      expiration: 86400000
    encryption:
      # AES 密钥，这里是开发环境的示例，实际使用中请更换为安全的随机密钥
      aes-key: ${AES_KEY:8EbY4aJDfFyuf2Vg1on5tQQvZZst+uy0p3evu04CvJc=}
      hash-pepper: ${HASH_PEPPER:kCtFFuFhJn+V8SGqCiXlJg==}
    # JWT 认证白名单（不走 JWT 鉴权，如 LLM 调用接口使用 API Key 独立认证）
    ignore-paths: /api/v1/user/hasUsername,/api/v1/users/register,/api/v1/users/login,/api/v1/users/password/**,/api/v1/tenants/invites/**/info,/api/v1/llm/**,/ws/**
  tenant:
    max-invite-code-per-day: 10
    max-notification-send-per-day: 5
  geoip:
    db-path: classpath:geoip/GeoLite2-City.mmdb
    enabled: true