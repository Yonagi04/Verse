name: Integration Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Backend MySQL and Redis Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: verse-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pverse-ci-only --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VERSE_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      VERSE_TEST_MYSQL_USER: root
      VERSE_TEST_MYSQL_PASSWORD: verse-ci-only
      VERSE_BUDGET_TEST_REDIS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run integration suite with Failsafe
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify
          -Pintegration -Dintegration-only=true
          -Dquery.cache.redis-address=redis://127.0.0.1:6379
          -Dmessaging.redis-address=redis://127.0.0.1:6379
      - name: Require complete integration reports
        run: python3 scripts/ci/check_test_reports.py integration
      - name: Upload integration and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-integration-reports
          path: |
            target/failsafe-reports/
            target/site/jacoco-it/
          retention-days: 7
      - name: Upload integration coverage to Codecov
        if: success() && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco-it/jacoco.xml
          flags: integration
          disable_search: true
          fail_ci_if_error: false
