name: Unit Test

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: Java 21 / Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode test